<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #05080d;
      }
      /* Orquestador delgado: cada escena es una sub-composición.
         Toda la animación vive dentro de compositions/frames/*.html */
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-x6kv" id="root" data-composition-id="main" data-start="0" data-duration="85" data-width="1920" data-height="1080">
      <!-- Escena 1 — El gancho (0:00–0:20). Ver STORYBOARD.md § Frame 01. -->
      <div data-hf-id="hf-tlbz" id="el-01-gancho" data-composition-id="gancho" data-composition-src="compositions/frames/01-gancho.html" data-start="0" data-duration="20" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- Escena 2 — El problema (0:20–0:45). Ver STORYBOARD.md § Frame 02. -->
      <div data-hf-id="hf-ohow" id="el-02-problema" data-composition-id="problema" data-composition-src="compositions/frames/02-problema.html" data-start="20" data-duration="25" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- Escena 3 — Presentamos la herramienta (0:45–1:00). Ver STORYBOARD.md § Frame 03. -->
      <div data-hf-id="hf-hggb" id="el-03-titulo" data-composition-id="titulo" data-composition-src="compositions/frames/03-titulo.html" data-start="45" data-duration="15" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!--
        ⚠️ HUECO TEMPORAL: escenas 04–06 son metraje real (demo grabada),
        aún sin grabar. Van aquí, entre la 3 y la 7. Cuando existan:
          1. Insertar sus <div data-composition-src="..."> con
             data-start = 60, 60+dur(04), 60+dur(04)+dur(05)...
          2. Correr el data-start de la escena 7 (abajo) para que empiece
             justo donde termine la 06 — hoy está pegada a la 3 nada más
             para poder previsualizar el cierre.
          3. Sumar data-duration del root a lo que resulte.
      -->

      <!-- Escena 7 — Cierre. Pegada temporalmente a la 3 (ver hueco arriba). -->
      <div data-hf-id="hf-a46s" id="el-07-cierre" data-composition-id="cierre" data-composition-src="compositions/frames/07-cierre.html" data-start="60" data-duration="25" data-track-index="1" data-width="1920" data-height="1080"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      // Root casi vacío a propósito: toda la animación vive en las sub-comps.
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
