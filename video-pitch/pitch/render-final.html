<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #05080d;
      }
      [data-composition-id="render-final"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!-- Export temporal para edición externa: escena 08 (cierre) sola. No es
         parte del guion final — se borra una vez que el equipo termina de
         editar fuera de HyperFrames. -->
    <div id="root" data-composition-id="render-final" data-start="0" data-duration="25" data-width="1920" data-height="1080">
      <div id="el-08-cierre" data-composition-id="cierre" data-composition-src="compositions/frames/08-cierre.html" data-start="0" data-duration="25" data-track-index="1" data-width="1920" data-height="1080"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["render-final"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
